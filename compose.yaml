name: processos-furg
services:
  postgres:
    image: postgres:17.10-alpine3.23@sha256:8189a1f6e40904781fc9e2612687877791d21679866db58b1de996b31fc312e4
    environment:
      POSTGRES_DB: processos
      POSTGRES_USER: processos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-processos}
    ports:
      - "${POSTGRES_PORT:-55434}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U processos -d processos"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: processos
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-processos-local}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  api:
    image: processos-furg-api:v2
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql://processos:processos@postgres:5432/processos?schema=public}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: processos
      S3_ACCESS_KEY: processos
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-processos-local}
      WEB_ORIGIN: http://localhost:8080
      API_PORT: 3000
      AUTH_MODE: ${AUTH_MODE:-development}
      SSO_ISSUER: ${SSO_ISSUER:-}
      SSO_JWKS_URL: ${SSO_JWKS_URL:-}
      SSO_CLIENT_ID: ${SSO_CLIENT_ID:-}
      PROCESS_REVIEW_WEBHOOK_URL: ${PROCESS_REVIEW_WEBHOOK_URL:-}
      PROCESS_REVIEW_WEBHOOK_SECRET: ${PROCESS_REVIEW_WEBHOOK_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  web:
    image: processos-furg-web:v2
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: /api/v1
        VITE_PUBLIC_SITE_URL: ${VITE_PUBLIC_SITE_URL:-http://localhost:8080}
        VITE_PUBLIC_INDEXING: ${VITE_PUBLIC_INDEXING:-false}
        VITE_OIDC_AUTHORITY: ${VITE_OIDC_AUTHORITY:-}
        VITE_OIDC_CLIENT_ID: ${VITE_OIDC_CLIENT_ID:-}
        VITE_OIDC_REDIRECT_URI: ${VITE_OIDC_REDIRECT_URI:-}
        VITE_OIDC_SCOPE: ${VITE_OIDC_SCOPE:-openid profile}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  postgres-data:
  minio-data:
